<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio — Mohaiminul Islam Nirob</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner container">
      <div class="header-right">
        <!-- Mode toggle first -->
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
          <i id="themeIcon" class="fa fa-moon-o"></i>
        </button>

        <!-- Hamburger menu for mobile -->
        <button id="menuToggle" class="icon-btn mobile-menu-btn" aria-label="Toggle menu">
          <i class="fa fa-bars"></i>
        </button>

        <!-- Desktop navigation -->
        <nav class="main-nav desktop-nav" aria-label="Main navigation">
          <a href="#" class="nav-link" data-page="about">About Me</a>
          <a href="#" class="nav-link" data-page="life">Life Events</a>
          <a href="#" class="nav-link" data-page="learnings">Learnings</a>
          <a href="#" class="nav-link" data-page="projects">Projects</a>
          <a href="#" class="nav-link" data-page="contact">Contact</a>
        </nav>
      </div>
    </div>

    <!-- Slide-in Mobile Menu -->
    <nav class="mobile-nav hidden" id="mobileNav">
      <a href="#" class="nav-link" data-page="about">About Me</a>
      <a href="#" class="nav-link" data-page="life">Life Events</a>
      <a href="#" class="nav-link" data-page="learnings">Learnings</a>
      <a href="#" class="nav-link" data-page="projects">Projects</a>
      <a href="#" class="nav-link" data-page="contact">Contact</a>
    </nav>
  </header>

  <!-- Main layout -->
  <main class="main container">
    <aside class="intro-column" aria-labelledby="introHeading">
      <div class="intro-box">
        <!-- Title + picture in a single row -->
        <div class="intro-top">
          <h1 id="introHeading">Hello, I'm <strong>Mohaiminul Islam Nirob</strong></h1>
          <img src="files/profile.jpg" alt="Mohaiminul" class="profile-inline">
        </div>

        <!-- Paragraph and buttons below -->
        <p class="intro-sub">Undergraduate Software Engineering student at Shahjalal University of Science &amp; Technology, Sylhet.</p>

        <div class="intro-actions">
          <button id="contactBtn" class="btn primary">Contact Me</button>
          <button id="downloadBtn" class="btn ghost">Download CV</button>
        </div>
      </div>
    </aside>

    <section class="page-column" id="pageColumn" aria-live="polite">
      <!-- Page content will be added by script.js -->
    </section>
  </main>

  <footer class="site-footer container">
    <small>©Mohaiminul Nirob — Portfolio</small>
  </footer>
</body>
</html>
